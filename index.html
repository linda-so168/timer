<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSC | Timer Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="image copy.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        msdNavy: '#244b8f',
                        msdYellow: '#e5a714',
                        msdSlate: '#3d4144',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        };
    </script>
    <style>
        /* Pulse animation for the Time Up screen */
        @keyframes custom-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-stop { animation: custom-pulse 0.8s infinite; }
    </style>
</head>
<body class="min-h-screen w-full bg-slate-50 flex flex-col overflow-x-hidden font-sans">

    <header class="flex flex-col gap-3 px-4 py-3 bg-white border-b-4 border-msdNavy shadow-sm z-10 sm:px-6 md:flex-row md:items-center md:justify-between md:px-12 md:py-2">
        <div class="flex flex-col items-center gap-3 text-center sm:flex-row sm:justify-center md:text-left md:justify-start">
            <img src="image copy.png" class="h-14 w-auto sm:h-16 md:h-20" alt="MSD Logo">
            <div class="hidden h-10 w-0.5 bg-slate-200 sm:block"></div>
            <div class="leading-tight">
                <h1 class="text-sm font-black text-msdSlate uppercase sm:text-base md:text-l">Mathematics Outstanding Students Cambodia</h1>
                <p class="text-[10px] font-bold text-msdNavy uppercase sm:text-xs">2026 Cambodia &#183; FINAL ROUND</p>
            </div>
        </div>
        <div id="status-pill" class="self-center rounded border-2 border-slate-200 px-4 py-1.5 text-xs font-extrabold uppercase text-slate-400 transition-all duration-300 sm:text-sm md:self-auto md:px-5 md:py-2 md:text-base">
            READY
        </div>
    </header>

    <main class="relative flex flex-1 items-center justify-center bg-[radial-gradient(circle_at_center,_#ffffff_0%,_#f1f5f9_100%)] px-3 py-4 sm:px-6 sm:py-6">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <span class="text-[18vh] font-black text-msdNavy opacity-[0.03] sm:text-[24vh] md:text-[30vh] lg:text-[35vh]">MOSC</span>
        </div>

        <div id="timer" class="z-10 flex w-full max-w-[1850px] items-end justify-center gap-0 font-mono font-bold leading-none text-msdSlate transition-colors duration-300 sm:gap-1">
            <div id="m-val" class="text-[min(32vw,24vh)] sm:text-[min(31vw,24vh)] md:text-[min(33vw,31vh)] lg:text-[min(37vw,43vh)] xl:text-[min(39vw,47vh)]">60</div><span class="mb-[2vh] mx-1 font-sans text-[clamp(0.85rem,2.2vw,2.5rem)] lowercase text-slate-600 sm:mx-3 sm:mb-[3vh]">min</span>
            <div class="text-[min(32vw,24vh)] text-slate-300 sm:text-[min(31vw,24vh)] md:text-[min(33vw,31vh)] lg:text-[min(37vw,43vh)] xl:text-[min(39vw,47vh)]">:</div>
            <div id="s-val" class="text-[min(32vw,24vh)] sm:text-[min(31vw,24vh)] md:text-[min(33vw,31vh)] lg:text-[min(37vw,43vh)] xl:text-[min(39vw,47vh)]">00</div><span class="mb-[2vh] mx-1 font-sans text-[clamp(0.85rem,2.2vw,2.5rem)] lowercase text-slate-600 sm:mx-3 sm:mb-[3vh]">s</span>
        </div>
    </main>

    <div class="w-full h-3 bg-slate-200">
        <div id="progress-bar" class="h-full w-full bg-gradient-to-r from-msdNavy to-msdYellow transition-all duration-1000 linear"></div>
    </div>

    <footer class="flex flex-wrap items-center justify-center gap-2 border-t border-slate-200 bg-white px-3 py-3 shadow-[0_-4px_10px_rgba(0,0,0,0.02)] sm:gap-4 sm:px-4">
        <button id="audio-toggle" onclick="toggleAudio()" class="min-w-[44px] rounded-lg border border-slate-300 px-4 py-2 text-[11px] font-bold uppercase text-msdSlate transition-all hover:bg-slate-50">
            &#128266; 
        </button>
        <div class="hidden h-6 w-px bg-slate-200 sm:block"></div>
        <button id="fullscreen-btn" onclick="toggleFullscreen()" class="min-w-[44px] rounded-lg border border-slate-300 px-4 py-2 text-[11px] font-bold uppercase text-msdSlate transition-all hover:bg-slate-50">
            &#9974; 
        </button>
        <div class="hidden h-6 w-px bg-slate-200 sm:block"></div>
        <div class="flex w-full items-center justify-center gap-2 sm:w-auto">
            
            <input id="minutes-input" type="number" min="1" step="1" value="60" onchange="setMinutesFromInput()" class="w-16 rounded-lg border border-slate-300 bg-white px-2 py-2 text-center font-mono text-sm font-bold text-msdSlate focus:border-msdNavy focus:outline-none sm:w-20 sm:text-base">
            <button id="add-minute-btn" onclick="addMinute()" class="rounded-lg border border-slate-300 bg-slate-100 px-4 py-2 text-xs font-bold uppercase tracking-wider text-msdSlate transition-all hover:bg-slate-200">
                +1 Min
            </button>
        </div>
        <div class="hidden h-6 w-px bg-slate-200 sm:block"></div>
        <button id="start-btn" onclick="toggleTimer()" class="btn-start rounded-lg bg-msdNavy px-5 py-2 text-xs font-bold uppercase tracking-wider text-white transition-all hover:-translate-y-0.5">
            &#9654; 
        </button>
        <button onclick="resetTimer()" class="rounded-lg border border-slate-300 bg-slate-100 px-5 py-2 text-xs font-bold uppercase tracking-wider text-msdSlate transition-all hover:bg-slate-200">
            &#8635; 
        </button>
    </footer>

    <div id="time-up-screen" class="fixed inset-0 bg-msdYellow hidden flex-col justify-center items-center z-[100]">
        <h2 class="m-0 px-4 text-center text-[18vw] font-black tracking-[4px] text-white animate-stop sm:text-[14vw] md:text-[12vw] md:tracking-[6px]">TIME UP!!</h2>
        <p class="px-6 text-center text-[4.5vw] font-extrabold uppercase tracking-[2px] text-msdNavy sm:text-[3vw] md:text-[2vw] md:tracking-[4px]">Please stop writing immediately</p>
        <button onclick="resetTimer()" class="mt-6 rounded-lg bg-white px-6 py-3 text-sm font-bold uppercase text-msdNavy shadow-lg transition-all hover:scale-105 sm:mt-8 sm:px-8">
            Close &amp; Reset
        </button>
    </div>

<script>
    // Configuration
    const DEFAULT_MINUTES = 60;
    let totalTime = DEFAULT_MINUTES * 60;
    let timeLeft = totalTime;
    let timerInterval = null;
    let audioEnabled = true;
    let audioPrimed = false;
    let tickResetTimeout = null;

    // Audio files
    const tickSound = new Audio('slow-cinematic-clock-ticking-357979.mp3');
    const alarmSound = new Audio('kitchen-timer-33043.mp3');
    tickSound.loop = false;
    alarmSound.loop = true;
    tickSound.preload = 'auto';
    alarmSound.preload = 'auto';
    tickSound.volume = 0.45;

    // Elements
    const mDisplay = document.getElementById('m-val');
    const sDisplay = document.getElementById('s-val');
    const startBtn = document.getElementById('start-btn');
    const statusPill = document.getElementById('status-pill');
    const progressBar = document.getElementById('progress-bar');
    const timerContainer = document.getElementById('timer');
    const alertScreen = document.getElementById('time-up-screen');
    const audioToggleBtn = document.getElementById('audio-toggle');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const minutesInput = document.getElementById('minutes-input');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        mDisplay.innerText = m.toString().padStart(2, '0');
        sDisplay.innerText = s.toString().padStart(2, '0');

        const percentage = totalTime > 0 ? (timeLeft / totalTime) * 100 : 0;
        progressBar.style.width = Math.max(0, percentage) + "%";

        if (timeLeft > 300) {
            timerContainer.classList.remove('text-msdYellow', 'text-red-600');
            timerContainer.classList.add('text-msdSlate');
        } else if (timeLeft > 60) {
            timerContainer.classList.remove('text-msdSlate', 'text-red-600');
            timerContainer.classList.add('text-msdYellow');
        } else {
            timerContainer.classList.remove('text-msdSlate', 'text-msdYellow');
            timerContainer.classList.add('text-red-600');
        }
    }

    function setStartButtonToStart() {
        startBtn.innerHTML = "&#9654; ";
        startBtn.classList.remove('bg-msdYellow');
        startBtn.classList.add('bg-msdNavy');
    }

    function setStartButtonToPause() {
        startBtn.innerHTML = "&#10074;&#10074;";
        startBtn.classList.remove('bg-msdNavy');
        startBtn.classList.add('bg-msdYellow');
    }

    function setReadyStatus() {
        statusPill.innerText = "READY";
        statusPill.className = "self-center rounded border-2 border-slate-200 px-4 py-1.5 text-xs font-extrabold uppercase text-slate-400 transition-all duration-300 sm:text-sm md:self-auto md:px-5 md:py-2 md:text-base";
    }

    function setPausedStatus() {
        statusPill.innerText = "PAUSED";
        statusPill.className = "self-center rounded border-2 border-msdYellow px-4 py-1.5 text-xs font-extrabold uppercase text-msdYellow transition-all duration-300 sm:text-sm md:self-auto md:px-5 md:py-2 md:text-base";
    }

    function setLiveStatus() {
        statusPill.innerText = "LIVE";
        statusPill.className = "self-center rounded border-2 border-green-600 px-4 py-1.5 text-xs font-extrabold uppercase text-green-600 transition-all duration-300 sm:text-sm md:self-auto md:px-5 md:py-2 md:text-base";
    }

    function setFinishedStatus() {
        statusPill.innerText = "FINISHED";
        statusPill.className = "self-center rounded border-2 border-red-600 px-4 py-1.5 text-xs font-extrabold uppercase text-red-600 transition-all duration-300 sm:text-sm md:self-auto md:px-5 md:py-2 md:text-base";
    }

    function updateFullscreenButton() {
        fullscreenBtn.innerHTML = document.fullscreenElement
            ? "&#10005;"
            : "&#9974;";
    }

    function updateAudioButton() {
        audioToggleBtn.innerHTML = audioEnabled ? "&#128266;" : "&#128263;";
    }

    function getMinutesValue() {
        const parsed = parseInt(minutesInput.value, 10);
        if (Number.isNaN(parsed) || parsed < 1) {
            return 1;
        }
        return parsed;
    }

    function syncMinutesInput() {
        minutesInput.value = Math.max(1, Math.ceil(totalTime / 60));
    }

    function stopTickSound(resetPosition = false) {
        clearTimeout(tickResetTimeout);
        tickResetTimeout = null;
        tickSound.pause();
        if (resetPosition) {
            tickSound.currentTime = 0;
        }
    }

    function stopAlarmSound() {
        alarmSound.pause();
        alarmSound.currentTime = 0;
    }

    function playTickSound() {
        if (!audioEnabled) {
            return;
        }
        stopAlarmSound();
        stopTickSound(true);
        tickSound.currentTime = 0;
        tickSound.play().catch(() => {});
        tickResetTimeout = window.setTimeout(() => {
            stopTickSound(true);
        }, 900);
    }

    function playAlarmSound() {
        if (!audioEnabled) {
            return;
        }
        stopTickSound(true);
        stopAlarmSound();
        alarmSound.play().catch(() => {});
    }

    function primeAudio() {
        if (audioPrimed) {
            return Promise.resolve();
        }

        const sounds = [tickSound, alarmSound];
        return Promise.all(sounds.map((sound) => {
            sound.muted = true;
            return sound.play()
                .then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                    sound.muted = false;
                })
                .catch(() => {
                    sound.muted = false;
                });
        })).finally(() => {
            audioPrimed = true;
        });
    }

    function applyMinutes(minutes) {
        totalTime = Math.max(60, minutes * 60);
        timeLeft = totalTime;
        clearInterval(timerInterval);
        timerInterval = null;
        alertScreen.classList.replace('flex', 'hidden');
        stopTickSound(true);
        stopAlarmSound();
        setStartButtonToStart();
        setReadyStatus();
        syncMinutesInput();
        updateDisplay();
    }

    function setMinutesFromInput() {
        applyMinutes(getMinutesValue());
    }

    function addMinute() {
        totalTime += 60;
        timeLeft += 60;
        alertScreen.classList.replace('flex', 'hidden');
        stopAlarmSound();
        if (!timerInterval) {
            setStartButtonToStart();
            setReadyStatus();
        }
        syncMinutesInput();
        updateDisplay();
    }

    function toggleTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            stopTickSound(true);
            setStartButtonToStart();
            setPausedStatus();
            return;
        }

        if (timeLeft === 0) {
            timeLeft = totalTime;
            updateDisplay();
        }

        alertScreen.classList.replace('flex', 'hidden');
        stopAlarmSound();

        timerInterval = setInterval(() => {
            timeLeft = Math.max(0, timeLeft - 1);
            updateDisplay();

            if (timeLeft === 0) {
                finishTimer();
            } else if (audioEnabled) {
                playTickSound();
            }
        }, 1000);

        setStartButtonToPause();
        setLiveStatus();

        if (audioEnabled) {
            primeAudio();
        }
    }

    function finishTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timeLeft = 0;
        updateDisplay();
        alertScreen.classList.replace('hidden', 'flex');
        playAlarmSound();
        setStartButtonToStart();
        setFinishedStatus();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timeLeft = totalTime;
        alertScreen.classList.replace('flex', 'hidden');
        stopTickSound(true);
        stopAlarmSound();
        startBtn.className = "btn-start rounded-lg bg-msdNavy px-5 py-2 text-xs font-bold uppercase tracking-wider text-white transition-all hover:-translate-y-0.5";
        setStartButtonToStart();
        setReadyStatus();
        updateDisplay();
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        updateAudioButton();

        if (!audioEnabled) {
            stopTickSound(true);
            stopAlarmSound();
            return;
        }

        primeAudio().finally(() => {
            if (timeLeft === 0 && !alertScreen.classList.contains('hidden')) {
                playAlarmSound();
            }
        });
    }

    function toggleFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
            return;
        }

        document.documentElement.requestFullscreen().catch(() => {});
    }

    document.addEventListener('fullscreenchange', updateFullscreenButton);

    syncMinutesInput();
    updateAudioButton();
    updateFullscreenButton();
    updateDisplay();
</script>

</body>
</html>
