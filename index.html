<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSC | Timer Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="image copy.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        msdNavy: '#244b8f',
                        msdYellow: '#e5a714',
                        msdSlate: '#3d4144',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    }
                }
            }
        };
    </script>
    <style>
        /* Pulse animation for the Time Up screen */
        @keyframes custom-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-stop { animation: custom-pulse 0.8s infinite; }
    </style>
</head>
<body class="h-screen w-full bg-slate-50 flex flex-col overflow-hidden font-sans">

    <header class="flex justify-between items-center px-12 py-2 bg-white border-b-4 border-msdNavy shadow-sm z-10">
        <div class="flex items-center gap-4">
            <img src="image copy.png" class="h-20 w-auto" alt="MSD Logo">
            <div class="h-10 w-0.5 bg-slate-200"></div>
            <div class="leading-tight">
                <h1 class="text-xl font-black text-msdSlate uppercase">Mathematics Outstanding Students Cambodia</h1>
                <p class="text-xs font-bold text-msdNavy uppercase">2026 Cambodia &#183; FINAL ROUND</p>
            </div>
        </div>
        <div id="status-pill" class="font-extrabold text-slate-400 border-2 border-slate-200 px-5 py-2 rounded uppercase transition-all duration-300">
            READY
        </div>
    </header>

    <main class="flex-1 flex justify-center items-center relative bg-[radial-gradient(circle_at_center,_#ffffff_0%,_#f1f5f9_100%)]">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
            <span class="text-[35vh] font-black text-msdNavy opacity-[0.03]">MOSC</span>
        </div>

        <div id="timer" class="font-mono font-bold text-msdSlate z-10 flex items-end leading-none transition-colors duration-300">
            <div id="m-val" class="text-[min(44vw,46vh)]">60</div><span class="font-sans text-[min(3.2vw,3.8vh)] text-slate-400 mx-4 lowercase mb-[3vh]">min</span>
            <div class="text-[min(44vw,46vh)] text-slate-300">:</div>
            <div id="s-val" class="text-[min(44vw,46vh)]">00</div><span class="font-sans text-[min(3.2vw,3.8vh)] text-slate-400 mx-4 lowercase mb-[3vh]">s</span>
        </div>
    </main>

    <div class="w-full h-3 bg-slate-200">
        <div id="progress-bar" class="h-full w-full bg-gradient-to-r from-msdNavy to-msdYellow transition-all duration-1000 linear"></div>
    </div>

    <footer class="bg-white px-4 py-3 flex flex-wrap justify-center items-center gap-4 border-t border-slate-200 shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
        <button id="audio-toggle" onclick="toggleAudio()" class="px-4 py-2 border border-slate-300 rounded-lg font-bold text-[11px] uppercase text-msdSlate hover:bg-slate-50 transition-all">
            &#128266; 
        </button>
        <div class="h-6 w-px bg-slate-200"></div>
        <button id="fullscreen-btn" onclick="toggleFullscreen()" class="px-4 py-2 border border-slate-300 rounded-lg font-bold text-[11px] uppercase text-msdSlate hover:bg-slate-50 transition-all">
            &#9974; 
        </button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2">
            
            <input id="minutes-input" type="number" min="1" step="1" value="60" onchange="setMinutesFromInput()" class="w-20 px-2 py-2 border border-slate-300 rounded-lg bg-white text-center font-mono text-base font-bold text-msdSlate focus:outline-none focus:border-msdNavy">
            <button id="add-minute-btn" onclick="addMinute()" class="px-4 py-2 bg-slate-100 text-msdSlate border border-slate-300 rounded-lg font-bold text-xs uppercase tracking-wider hover:bg-slate-200 transition-all">
                +1 Min
            </button>
        </div>
        <div class="h-6 w-px bg-slate-200"></div>
        <button id="start-btn" onclick="toggleTimer()" class="btn-start px-5 py-2 bg-msdNavy text-white rounded-lg font-bold text-xs uppercase tracking-wider hover:-translate-y-0.5 transition-all">
            &#9654; 
        </button>
        <button onclick="resetTimer()" class="px-5 py-2 bg-slate-100 text-msdSlate border border-slate-300 rounded-lg font-bold text-xs uppercase tracking-wider hover:bg-slate-200 transition-all">
            &#8635; 
        </button>
    </footer>

    <div id="time-up-screen" class="fixed inset-0 bg-msdYellow hidden flex-col justify-center items-center z-[100]">
        <h2 class="text-[12vw] font-black text-white m-0 tracking-[6px] animate-stop">TIME UP!!</h2>
        <p class="text-[2vw] font-extrabold text-msdNavy tracking-[4px] uppercase">Please stop writing immediately</p>
        <button onclick="resetTimer()" class="mt-8 px-8 py-3 bg-white text-msdNavy rounded-lg font-bold text-sm uppercase shadow-lg hover:scale-105 transition-all">
            Close &amp; Reset
        </button>
    </div>

<script>
    // Configuration
    const DEFAULT_MINUTES = 60;
    let totalTime = DEFAULT_MINUTES * 60;
    let timeLeft = totalTime;
    let timerInterval = null;
    let audioEnabled = true;
    let audioPrimed = false;

    // Audio files
    const tickSound = new Audio('slow-cinematic-clock-ticking-357979.mp3');
    const alarmSound = new Audio('kitchen-timer-33043.mp3');
    tickSound.loop = true;
    alarmSound.loop = true;
    tickSound.preload = 'auto';
    alarmSound.preload = 'auto';
    tickSound.volume = 0.45;

    // Elements
    const mDisplay = document.getElementById('m-val');
    const sDisplay = document.getElementById('s-val');
    const startBtn = document.getElementById('start-btn');
    const statusPill = document.getElementById('status-pill');
    const progressBar = document.getElementById('progress-bar');
    const timerContainer = document.getElementById('timer');
    const alertScreen = document.getElementById('time-up-screen');
    const audioToggleBtn = document.getElementById('audio-toggle');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const minutesInput = document.getElementById('minutes-input');

    function updateDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        mDisplay.innerText = m.toString().padStart(2, '0');
        sDisplay.innerText = s.toString().padStart(2, '0');

        const percentage = totalTime > 0 ? (timeLeft / totalTime) * 100 : 0;
        progressBar.style.width = Math.max(0, percentage) + "%";

        if (timeLeft > 300) {
            timerContainer.classList.remove('text-msdYellow', 'text-red-600');
            timerContainer.classList.add('text-msdSlate');
        } else if (timeLeft > 60) {
            timerContainer.classList.remove('text-msdSlate', 'text-red-600');
            timerContainer.classList.add('text-msdYellow');
        } else {
            timerContainer.classList.remove('text-msdSlate', 'text-msdYellow');
            timerContainer.classList.add('text-red-600');
        }
    }

    function setStartButtonToStart() {
        startBtn.innerHTML = "&#9654; ";
        startBtn.classList.remove('bg-msdYellow');
        startBtn.classList.add('bg-msdNavy');
    }

    function setStartButtonToPause() {
        startBtn.innerHTML = "&#10074;&#10074;";
        startBtn.classList.remove('bg-msdNavy');
        startBtn.classList.add('bg-msdYellow');
    }

    function setReadyStatus() {
        statusPill.innerText = "READY";
        statusPill.className = "font-extrabold text-slate-400 border-2 border-slate-200 px-5 py-2 rounded uppercase transition-all duration-300";
    }

    function setPausedStatus() {
        statusPill.innerText = "PAUSED";
        statusPill.className = "font-extrabold text-msdYellow border-2 border-msdYellow px-5 py-2 rounded uppercase transition-all duration-300";
    }

    function setLiveStatus() {
        statusPill.innerText = "LIVE";
        statusPill.className = "font-extrabold text-green-600 border-2 border-green-600 px-5 py-2 rounded uppercase transition-all duration-300";
    }

    function setFinishedStatus() {
        statusPill.innerText = "FINISHED";
        statusPill.className = "font-extrabold text-red-600 border-2 border-red-600 px-5 py-2 rounded uppercase transition-all duration-300";
    }

    function updateFullscreenButton() {
        fullscreenBtn.innerHTML = document.fullscreenElement
            ? "&#10005;"
            : "&#9974;";
    }

    function getMinutesValue() {
        const parsed = parseInt(minutesInput.value, 10);
        if (Number.isNaN(parsed) || parsed < 1) {
            return 1;
        }
        return parsed;
    }

    function syncMinutesInput() {
        minutesInput.value = Math.max(1, Math.ceil(totalTime / 60));
    }

    function stopTickSound(resetPosition = false) {
        tickSound.pause();
        if (resetPosition) {
            tickSound.currentTime = 0;
        }
    }

    function stopAlarmSound() {
        alarmSound.pause();
        alarmSound.currentTime = 0;
    }

    function playTickSound() {
        if (!audioEnabled) {
            return;
        }
        stopAlarmSound();
        tickSound.currentTime = 0;
        tickSound.play().catch(() => {});
    }

    function playAlarmSound() {
        if (!audioEnabled) {
            return;
        }
        stopTickSound(true);
        stopAlarmSound();
        alarmSound.play().catch(() => {});
    }

    function primeAudio() {
        if (audioPrimed) {
            return Promise.resolve();
        }

        const sounds = [tickSound, alarmSound];
        return Promise.all(sounds.map((sound) => {
            sound.muted = true;
            return sound.play()
                .then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                    sound.muted = false;
                })
                .catch(() => {
                    sound.muted = false;
                });
        })).finally(() => {
            audioPrimed = true;
        });
    }

    function applyMinutes(minutes) {
        totalTime = Math.max(60, minutes * 60);
        timeLeft = totalTime;
        clearInterval(timerInterval);
        timerInterval = null;
        alertScreen.classList.replace('flex', 'hidden');
        stopTickSound(true);
        stopAlarmSound();
        setStartButtonToStart();
        setReadyStatus();
        syncMinutesInput();
        updateDisplay();
    }

    function setMinutesFromInput() {
        applyMinutes(getMinutesValue());
    }

    function addMinute() {
        totalTime += 60;
        timeLeft += 60;
        alertScreen.classList.replace('flex', 'hidden');
        stopAlarmSound();
        if (!timerInterval) {
            setStartButtonToStart();
            setReadyStatus();
        }
        syncMinutesInput();
        updateDisplay();
    }

    function toggleTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            stopTickSound(true);
            setStartButtonToStart();
            setPausedStatus();
            return;
        }

        if (timeLeft === 0) {
            timeLeft = totalTime;
            updateDisplay();
        }

        alertScreen.classList.replace('flex', 'hidden');
        stopAlarmSound();

        timerInterval = setInterval(() => {
            timeLeft = Math.max(0, timeLeft - 1);
            updateDisplay();

            if (timeLeft === 0) {
                finishTimer();
            }
        }, 1000);

        setStartButtonToPause();
        setLiveStatus();

        if (audioEnabled) {
            primeAudio().finally(() => {
                if (timerInterval) {
                    playTickSound();
                }
            });
        }
    }

    function finishTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timeLeft = 0;
        updateDisplay();
        alertScreen.classList.replace('hidden', 'flex');
        playAlarmSound();
        setStartButtonToStart();
        setFinishedStatus();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timeLeft = totalTime;
        alertScreen.classList.replace('flex', 'hidden');
        stopTickSound(true);
        stopAlarmSound();
        startBtn.className = "btn-start px-8 py-3 bg-msdNavy text-white rounded-lg font-bold text-sm uppercase tracking-wider hover:-translate-y-0.5 transition-all";
        setStartButtonToStart();
        setReadyStatus();
        updateDisplay();
    }

    function toggleAudio() {
        audioEnabled = !audioEnabled;
        audioToggleBtn.innerHTML = audioEnabled ? "&#128266; " : "&#128263; ";

        if (!audioEnabled) {
            stopTickSound(true);
            stopAlarmSound();
            return;
        }

        primeAudio().finally(() => {
            if (timerInterval) {
                playTickSound();
            } else if (timeLeft === 0 && !alertScreen.classList.contains('hidden')) {
                playAlarmSound();
            }
        });
    }

    function toggleFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
            return;
        }

        document.documentElement.requestFullscreen().catch(() => {});
    }

    document.addEventListener('fullscreenchange', updateFullscreenButton);

    syncMinutesInput();
    updateFullscreenButton();
    updateDisplay();
</script>

</body>
</html>
